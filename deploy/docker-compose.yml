name: neu-ai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: neu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neu -d neu"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://neu:${POSTGRES_PASSWORD}@db:5432/neu
      UPLOAD_DIR: /data/uploads
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      BACKEND_URL: https://${DOMAIN}
      FRONTEND_URL: https://${DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      STT_PROVIDER: ${STT_PROVIDER:-sarvam}
      SARVAM_API_KEY: ${SARVAM_API_KEY}
      LANGUAGE_LLM_FALLBACK: ${LANGUAGE_LLM_FALLBACK:-true}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-}
      BOT_PROVIDER: ${BOT_PROVIDER:-none}
      RECALL_API_KEY: ${RECALL_API_KEY:-}
      RECALL_REGION: ${RECALL_REGION:-us-west-2}
      BOT_NAME: ${BOT_NAME:-Neu AI Notetaker}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-changeme-webhook-secret}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Neu AI <noreply@localhost>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-0}
    volumes:
      - uploads:/data/uploads

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
